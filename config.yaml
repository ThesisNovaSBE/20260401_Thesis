# ── Data paths ──
# Set these to your local MIMIC-IV directories, or leave empty to use synthetic data.
# These can also be overridden via the .env file (environment variables take precedence).
data:
  mimic_iv_dir: ""          # e.g. /home/user/data/mimic-iv/2.2
  mimic_iv_note_dir: ""     # e.g. /home/user/data/mimic-iv-note/2.2
  synthetic_n_patients: 2000
  synthetic_seed: 42

# ── Run mode ──
# quick = small/fast (minutes) for development; full = the real run.
# Switch with `--mode quick|full` on the CLI, or change `mode` here.
run:
  mode: quick
  random_state: 42
  quick:
    n_rows: 4000            # subsample feature matrix to this many rows (0 = use all)
    optuna_trials: 15
    cv_folds: 3
  full:
    n_rows: 0
    optuna_trials: 150
    cv_folds: 5

# ── Cohort definition ──
cohort:
  readmission_window_days: 30
  min_age: 18
  exclude_in_hospital_death: true
  exclude_elective: true

# ── Feature engineering ──
features:
  lab_items:
    - glucose
    - creatinine
    - hemoglobin
    - white_blood_cells
    - platelets
    - sodium
    - potassium
    - bicarbonate
  vital_items:
    - heart_rate
    - systolic_bp
    - diastolic_bp
    - temperature
    - respiratory_rate
    - spo2
  lab_aggregates: [last, mean, min, max]   # aggregates computed per admission
  comorbidity_scheme: charlson             # charlson | elixhauser | both

# ── Stage 1: Classical ML ──
stage1:
  # Which model to train / tune. One of: logistic_regression | xgboost | histgradientboosting
  model: xgboost
  models:                                  # the full comparison set (for reference)
    - logistic_regression
    - xgboost
    - histgradientboosting
  target_recall: 0.85                      # operating point: lowest threshold with recall >= this
  recall_report_points: [0.80, 0.85, 0.90] # also report precision/specificity at these recalls
  test_size: 0.2
  use_smote: false                         # optional ablation; if true, applied INSIDE CV folds only
  early_stopping_rounds: 50                # XGBoost early stopping (n_estimators not tuned)
  n_estimators_cap: 2000                   # XGBoost upper bound used with early stopping

# ── Stage 2: Clinical encoder ──
# Model: Clinical-Longformer (Li et al. 2022, arXiv:2201.11838)
# Chosen over Bio_ClinicalBERT (512-token limit) and Clinical-BigBird:
#   - 4096-token context window handles full discharge notes (avg 1435 words in MIMIC-III)
#   - Outperforms ClinicalBERT on all 10 benchmarks incl. MIMIC-AKI binary classification
#   - Authors explicitly recommend it over Clinical-BigBird for limited-resource settings
#   - Trained on MIMIC-III clinical notes — same domain as this project
stage2:
  model_name: "yikuan8/Clinical-Longformer"
  max_seq_length: 512           # token budget per note (Longformer supports up to 4096)
                                # 512 is the practical limit on CPU; bump to 1024+ if using GPU
  max_train_notes: 15000        # cap training notes (stratified by label)
                                # full 251k notes × periodic eval = weeks on CPU; 15k ≈ 9 hours train
  max_eval_notes: 3000          # cap eval set used for checkpoint selection during training
                                # 62k test notes × 5 epochs = days of eval alone; 3k ≈ 30 min/epoch
  batch_size: 2                 # small batch + gradient accumulation for Apple Silicon memory
  gradient_accumulation_steps: 8
  epochs: 5
  learning_rate: 2.0e-5
  threshold: 0.5                # Stage 2 confirmation threshold (tune after training)

# ── Stage 3: Explanation (optional) ──
# Model: phi4-mini via Ollama
# Chosen over Meditron-7B (base model, not instruction-tuned) and gemma3:
#   - phi4-mini is instruction-tuned — reliably follows prompts
#   - Strong reasoning quality for its size (~3.8B), fast on Apple Silicon
#   - Stage 3 is a structured explanation task; instruction-following matters
#     more than medical domain pre-training here
# To enable: set enabled: true and run `ollama pull phi4-mini`
stage3:
  enabled: false
  ollama_model: "phi4-mini"
  temperature: 0.3

# ── Output ──
output:
  model_dir: "models"
  log_dir: "logs"
  processed_dir: "data/processed"
